<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Solar 3D</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

    <canvas id="scena"></canvas>

    <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js"
  }
}
</script>

    <script type="module">
        import * as THREE from 'three';

        const canvas = document.getElementById('scena');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 40, 120);
        camera.lookAt(0, 0, 0);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Lumini
        const sunLight = new THREE.PointLight(0xfff5cc, 3.5, 600);
        scene.add(sunLight);
        scene.add(new THREE.AmbientLight(0x112244, 0.4));

        // Texture loader
        const tl = new THREE.TextureLoader();
        tl.load('poze planete/2k_stars_milky_way.jpg', function (texture) {
            scene.background = texture;
        });

        // Stele
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(3000 * 3);
        for (let i = 0; i < 3000; i++) {
            const r = 300 + Math.random() * 400;
            const t = Math.random() * Math.PI * 2;
            const p = Math.acos(2 * Math.random() - 1);
            starPos[i * 3] = r * Math.sin(p) * Math.cos(t);
            starPos[i * 3 + 1] = r * Math.sin(p) * Math.sin(t);
            starPos[i * 3 + 2] = r * Math.cos(p);
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.4 })));

        // Soare
        const sun = new THREE.Mesh(
            new THREE.SphereGeometry(5, 64, 64),
            new THREE.MeshBasicMaterial({ map: tl.load('poze planete/2k_sun.jpg') })
        );
        scene.add(sun);

        // Functie orbita vizibila
        function makeOrbit(dist) {
            const pts = [];
            for (let i = 0; i <= 128; i++) {
                const a = (i / 128) * Math.PI * 2;
                pts.push(new THREE.Vector3(Math.cos(a) * dist, 0, Math.sin(a) * dist));
            }
            const line = new THREE.Line(
                new THREE.BufferGeometry().setFromPoints(pts),
                new THREE.LineBasicMaterial({ color: 0x1a3a5a, transparent: true, opacity: 0.4 })
            );
            scene.add(line);
        }

        // Date planete
        const planete = [
            { nume: 'Mercur', tex: '2k_mercury.jpg', raza: 0.38, dist: 10, viteza: 0.008 },
            { nume: 'Venus', tex: '2k_venus_surface.jpg', raza: 0.9, dist: 15, viteza: 0.006 },
            { nume: 'Pamant', tex: '2k_earth_daymap.jpg', raza: 1.0, dist: 21, viteza: 0.004 },
            { nume: 'Marte', tex: '2k_mars.jpg', raza: 0.55, dist: 28, viteza: 0.003 },
            { nume: 'Jupiter', tex: '2k_jupiter.jpg', raza: 2.5, dist: 40, viteza: 0.002 },
            { nume: 'Saturn', tex: '2k_saturn.jpg', raza: 2.1, dist: 54, viteza: 0.0015 },
            { nume: 'Uranus', tex: '2k_uranus.jpg', raza: 1.5, dist: 66, viteza: 0.001 },
            { nume: 'Neptun', tex: '2k_neptune.jpg', raza: 1.4, dist: 78, viteza: 0.0008 },
        ];

        const pivoturi = [];

        planete.forEach(p => {
            makeOrbit(p.dist);

            const pivot = new THREE.Object3D();
            pivot.rotation.y = Math.random() * Math.PI * 2; // pozitie initiala random
            scene.add(pivot);

            const mesh = new THREE.Mesh(
                new THREE.SphereGeometry(p.raza, 48, 48),
                new THREE.MeshStandardMaterial({
                    map: tl.load('poze planete/' + p.tex),
                    roughness: 0.7,
                    metalness: 0.0
                })
            );
            mesh.position.x = p.dist;
            pivot.add(mesh);

            // Inele Saturn
            if (p.nume === 'Saturn') {
  const ringGeo = new THREE.RingGeometry(p.raza * 1.2, p.raza * 1.9, 64);

  // Fix UV-uri ca textura sa mearga de la interior la exterior
  const pos = ringGeo.attributes.position;
  const uv  = ringGeo.attributes.uv;
  const innerR = p.raza * 1.2;
  const outerR = p.raza * 1.9;

  for (let i = 0; i < pos.count; i++) {
    const v = new THREE.Vector3().fromBufferAttribute(pos, i);
    const dist = v.length(); // distanta de la centru
    const t = (dist - innerR) / (outerR - innerR); // 0 = interior, 1 = exterior
    uv.setXY(i, t, 0.5); // textura se intinde de la stanga la dreapta
  }

  const ringMat = new THREE.MeshBasicMaterial({
    map: tl.load('poze planete/2k_saturn_ring_alpha.png'),
    side: THREE.DoubleSide,
    transparent: true,
    alphaMap: tl.load('poze planete/2k_saturn_ring_alpha.png'),
    opacity: 1.0
  });

  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 2;
  ring.rotation.z = 0.45;
  mesh.add(ring);
}
            pivoturi.push({ pivot, mesh, viteza: p.viteza });
        });

        // Animatie
        function animate() {
            requestAnimationFrame(animate);

            sun.rotation.y += 0.001;

            pivoturi.forEach(p => {
                p.pivot.rotation.y += p.viteza;
                p.mesh.rotation.y += 0.005;
            });

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>

</html>
