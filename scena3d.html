<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Solar 3D</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        #panel {
            position: fixed;
            left: -160px; /* ascuns by default */
            top: 0;
            height: 100%;
            width: 160px;
            background: rgba(0, 10, 30, 0.75);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            padding: 20px 10px;
            gap: 8px;
            z-index: 10;
            transition: left 0.3s ease; /* animatie slide */
        }

        #panel.deschis {
            left: 0;
        }

        #togglePanel {
            position: fixed;
            left: 10px;
            top: 10px;
            z-index: 20;
            background: rgba(0, 10, 30, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: left 0.3s ease;
        }

        #togglePanel.deschis {
            left: 170px; /* se muta odata cu panoul */
        }       

        #panel h3 {
            color: #aaccff;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
            font-family: sans-serif;
            text-align: center;
        }

        .btn-planeta {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-family: sans-serif;
            text-align: left;
            transition: background 0.2s;
        }

        .btn-planeta:hover {
            background: rgba(255,255,255,0.15);
        }

        .btn-planeta.activ {
            background: rgba(50, 150, 255, 0.3);
            border-color: rgba(50, 150, 255, 0.6);
        }

        #btnElibereaza {
            margin-top: auto;
            background: rgba(255, 80, 80, 0.15);
            border: 1px solid rgba(255, 80, 80, 0.3);
            color: #ff9999;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-family: sans-serif;
            transition: background 0.2s;
        }

        #btnElibereaza:hover {
            background: rgba(255, 80, 80, 0.3);
        }
    </style>
</head>

<body>

    <canvas id="scena"></canvas>
    <div id="panel">
        <h3>Planete</h3>
        <button class="btn-planeta" data-index="-1">☀️ Soare</button>
        <button class="btn-planeta" data-index="0">🪨 Mercur</button>
        <button class="btn-planeta" data-index="1">🌕 Venus</button>
        <button class="btn-planeta" data-index="2">🌍 Pamant</button>
        <button class="btn-planeta" data-index="3">🌙 Luna</button>
        <button class="btn-planeta" data-index="4">🔴 Marte</button>
        <button class="btn-planeta" data-index="5">🪐 Jupiter</button>
        <button class="btn-planeta" data-index="6">💍 Saturn</button>
        <button class="btn-planeta" data-index="7">🔵 Uranus</button>
        <button class="btn-planeta" data-index="8">🔵 Neptun</button>
        <button id="btnElibereaza">Reset</button>
    </div>
    <button id="togglePanel">☰</button>

    <script type="importmap">
    {
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
        "three/examples/jsm/controls/OrbitControls": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/controls/OrbitControls.js"
        }
    }
</script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls';

        const canvas = document.getElementById('scena');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 25, 80);
        camera.lookAt(0, 0, 0);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;       // miscare lina
        controls.dampingFactor = 0.05;
        controls.minDistance = 10;
        controls.maxDistance = 80;         // zoom maxim 

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Lumini
        const sunLight = new THREE.PointLight(0xfff5cc, 2.0, 50);
        scene.add(sunLight);
        scene.add(new THREE.AmbientLight(0x223355, 2.5));

        // Texture loader
        const tl = new THREE.TextureLoader();
        tl.load('poze planete/2k_stars_milky_way.jpg', function (texture) {
                const skyGeo = new THREE.SphereGeometry(100, 64, 64);
                const skyMat = new THREE.MeshBasicMaterial({
                    map: texture,
                    side: THREE.BackSide // textura pe interior
                });
                const sky = new THREE.Mesh(skyGeo, skyMat);
                scene.add(sky);
            });

         // Stele
        // const starGeo = new THREE.BufferGeometry();
        // const starPos = new Float32Array(3000 * 3);
        // for (let i = 0; i < 3000; i++) {
        //     const r = 300 + Math.random() * 400;
        //     const t = Math.random() * Math.PI * 2;
        //     const p = Math.acos(2 * Math.random() - 1);
        //     starPos[i * 3] = r * Math.sin(p) * Math.cos(t);
        //     starPos[i * 3 + 1] = r * Math.sin(p) * Math.sin(t);
        //     starPos[i * 3 + 2] = r * Math.cos(p);
        // }
        // starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        // scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.4 })));

        // Soare
        const sun = new THREE.Mesh(
            new THREE.SphereGeometry(2.5, 64, 64),
            new THREE.MeshBasicMaterial({ map: tl.load('poze planete/2k_sun.jpg') })
        );
        scene.add(sun);

        // Functie orbita vizibila
        function makeOrbit(dist) {
            const pts = [];
            for (let i = 0; i <= 128; i++) {
                const a = (i / 128) * Math.PI * 2;
                pts.push(new THREE.Vector3(Math.cos(a) * dist, 0, Math.sin(a) * dist));
            }
            const line = new THREE.Line(
                new THREE.BufferGeometry().setFromPoints(pts),
                new THREE.LineBasicMaterial({ color: 0x1a3a5a, transparent: true, opacity: 0.4 })
            );
            scene.add(line);
        }

        // Date planete
        const planete = [
            { nume: 'Mercur', tex: '2k_mercury.jpg', raza: 0.2, dist: 5, viteza: 0.008 },
            { nume: 'Venus', tex: '2k_venus_surface.jpg', raza: 0.45, dist: 8, viteza: 0.006, glow: 0xffaa33 },
            { nume: 'Pamant', tex: '2k_earth_daymap.jpg', raza: 0.5, dist: 11, viteza: 0.004, areLuna: true, glow: 0x3399ff },
            { nume: 'Marte', tex: '2k_mars.jpg', raza: 0.28, dist: 14, viteza: 0.003, glow: 0xff4400 },
            { nume: 'Jupiter', tex: '2k_jupiter.jpg', raza: 1.3, dist: 20, viteza: 0.002, glow: 0xffcc88 },
            { nume: 'Saturn', tex: '2k_saturn.jpg', raza: 1.1, dist: 27, viteza: 0.0015, glow: 0xffdd99 },
            { nume: 'Uranus', tex: '2k_uranus.jpg', raza: 0.75, dist: 33, viteza: 0.001, color: 0x99cccc, glow: 0x88ffee },
            { nume: 'Neptun', tex: '2k_neptune.jpg', raza: 0.7, dist: 39, viteza: 0.0008, glow: 0x2244ff },
        ];

        const pivoturi = [];

        function addGlow(mesh, raza, culoare) {
            const glowMesh = new THREE.Mesh(
                new THREE.SphereGeometry(raza * 1.02, 32, 32),
                new THREE.MeshBasicMaterial({
                    color: culoare,
                    transparent: true,
                    opacity: 0.55,
                    side: THREE.BackSide,
                    depthWrite: false
                })
            );
            mesh.add(glowMesh);
        }

        planete.forEach(p => {
            makeOrbit(p.dist);

            const pivot = new THREE.Object3D();
            pivot.rotation.y = Math.random() * Math.PI * 2; // pozitie initiala random
            scene.add(pivot);

            const mesh = new THREE.Mesh(
                new THREE.SphereGeometry(p.raza, 48, 48),
                new THREE.MeshStandardMaterial({
                    map: tl.load('poze planete/' + p.tex),
                    color: p.color || 0xffffff,
                    roughness: 2.0,
                    metalness: 0.0
                })
            );
            mesh.position.x = p.dist;
            pivot.add(mesh);
            if (p.glow) addGlow(mesh, p.raza, p.glow);

            // Inele Saturn
            if (p.nume === 'Saturn') {
                const ringGeo = new THREE.RingGeometry(p.raza * 1.2, p.raza * 1.9, 64);

                // Fix UV-uri ca textura sa mearga de la interior la exterior
                const pos = ringGeo.attributes.position;
                const uv = ringGeo.attributes.uv;
                const innerR = p.raza * 1.2;
                const outerR = p.raza * 1.9;

                for (let i = 0; i < pos.count; i++) {
                    const v = new THREE.Vector3().fromBufferAttribute(pos, i);
                    const dist = v.length(); // distanta de la centru
                    const t = (dist - innerR) / (outerR - innerR); // 0 = interior, 1 = exterior
                    uv.setXY(i, t, 0.5); // textura se intinde de la stanga la dreapta
                }

                const ringMat = new THREE.MeshBasicMaterial({
                    map: tl.load('poze planete/2k_saturn_ring_alpha.png'),
                    side: THREE.DoubleSide,
                    transparent: true,
                    alphaMap: tl.load('poze planete/2k_saturn_ring_alpha.png'),
                    opacity: 1.0
                });

                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2;
                ring.rotation.z = 0.45;
                mesh.add(ring);
            }
            pivoturi.push({ pivot, mesh, viteza: p.viteza });

            // Luna dupa pamant
            if (p.areLuna) {
                const lunaPivot = new THREE.Object3D();
                mesh.add(lunaPivot); // atașat la Pamant

                const luna = new THREE.Mesh(
                    new THREE.SphereGeometry(0.27, 32, 32),
                    new THREE.MeshStandardMaterial({
                        map: tl.load('poze planete/2k_moon.jpg'),
                        roughness: 1.0,
                        metalness: 0.0
                    })
                );
                luna.position.x = 2.5; // distanta fata de Pamant
                lunaPivot.add(luna);

                pivoturi.splice(3, 0, { pivot: lunaPivot, mesh: luna, viteza: 0.02 }); // viteza orbita luna
            }
        });
    
        // Centura de asteroizi
        const asteroidGeo = new THREE.BufferGeometry();
        const asteroidPos = new Float32Array(800 * 3);
        const asteroidAngles = new Float32Array(800);
        const asteroidSpeeds = new Float32Array(800);
        const asteroidRadii = new Float32Array(800);

        for (let i = 0; i < 800; i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = 33 + Math.random() * 5; // intre Marte si Jupiter
            const y = (Math.random() - 0.5) * 1.5;

            asteroidAngles[i] = angle;
            asteroidSpeeds[i] = 0.0015 + Math.random() * 0.001;
            asteroidRadii[i] = dist;

            asteroidPos[i * 3] = Math.cos(angle) * dist;
            asteroidPos[i * 3 + 1] = y;
            asteroidPos[i * 3 + 2] = Math.sin(angle) * dist;
        }

        asteroidGeo.setAttribute('position', new THREE.BufferAttribute(asteroidPos, 3));
        const asteroidMesh = new THREE.Points(
            asteroidGeo,
            new THREE.PointsMaterial({ color: 0x888877, size: 0.15 })
        );
        scene.add(asteroidMesh);
    
        // Cometa
        const cometPivot = new THREE.Object3D();
        scene.add(cometPivot);

        const cometMesh = new THREE.Mesh(
            new THREE.SphereGeometry(0.5, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xffffff })
        );
        cometMesh.position.x = 90;
        cometPivot.add(cometMesh);

        // Coada cometei - particule
        const coadaGeo = new THREE.BufferGeometry();
        const coadaPos = new Float32Array(200 * 3);
        const coadaGeo2 = new THREE.BufferAttribute(coadaPos, 3);
        coadaGeo.setAttribute('position', coadaGeo2);
    
        const coada1 = new THREE.Points(coadaGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, transparent: true, opacity: 0.8, depthWrite: false }));
        const coada2 = new THREE.Points(coadaGeo, new THREE.PointsMaterial({ color: 0xaaddff, size: 0.2, transparent: true, opacity: 0.4, depthWrite: false }));
        const coada3 = new THREE.Points(coadaGeo, new THREE.PointsMaterial({ color: 0x4488ff, size: 0.3, transparent: true, opacity: 0.15, depthWrite: false }));
        scene.add(coada1, coada2, coada3);
    
        // Focus camera pe planeta
        let targetPosition = null;
        let targetLookAt = null;
        let focusActive = false;
    
        function focusPePlaneta(index) {
            document.querySelectorAll('.btn-planeta').forEach(b => b.classList.remove('activ'));
            document.querySelector(`[data-index="${index}"]`).classList.add('activ');
            focusActive = true;

            if (index === -1) {
                targetPosition = new THREE.Vector3(0, 15, 30);
                targetLookAt = new THREE.Vector3(0, 0, 0);
                return;
            }

            const pos = new THREE.Vector3();
            pivoturi[index].mesh.getWorldPosition(pos);

            // Luna are raza mai mica
            const raza = index === 3 ? 0.27 : planete[index < 3 ? index : index - 1].raza;
            targetPosition = new THREE.Vector3(pos.x + raza * 6, pos.y + raza * 3, pos.z + raza * 6);
            targetLookAt = pos.clone();
        }

        document.querySelectorAll('.btn-planeta').forEach(btn => {
            btn.addEventListener('click', () => {
                const index = parseInt(btn.dataset.index);
                focusPePlaneta(index);
            });
        });
    
        const toggleBtn = document.getElementById('togglePanel');
        const panel = document.getElementById('panel');

        toggleBtn.addEventListener('click', () => {
            panel.classList.toggle('deschis');
            toggleBtn.classList.toggle('deschis');
        });

        document.getElementById('btnElibereaza').addEventListener('click', () => {
            focusActive = false;
            document.querySelectorAll('.btn-planeta').forEach(b => b.classList.remove('activ'));
        });

        // Animatie
        function animate() {
            requestAnimationFrame(animate);

            controls.update();

            sun.rotation.y += 0.001;

            pivoturi.forEach(p => {
                p.pivot.rotation.y += p.viteza;
                p.mesh.rotation.y += 0.005;
            });

            // Asteroizi
            const aPos = asteroidGeo.attributes.position.array;
            for (let i = 0; i < 800; i++) {
                asteroidAngles[i] += asteroidSpeeds[i];
                aPos[i * 3] = Math.cos(asteroidAngles[i]) * asteroidRadii[i];
                aPos[i * 3 + 2] = Math.sin(asteroidAngles[i]) * asteroidRadii[i];
            }
            asteroidGeo.attributes.position.needsUpdate = true;

            // Cometa
            cometPivot.rotation.y += 0.003;
            cometPivot.rotation.x += 0.0005; // orbita inclinata

            const cometPos = new THREE.Vector3();
            cometMesh.getWorldPosition(cometPos);

            const coadaArr = coadaGeo.attributes.position.array;
            for (let i = 199; i > 0; i--) {
                coadaArr[i * 3] = coadaArr[(i - 1) * 3];
                coadaArr[i * 3 + 1] = coadaArr[(i - 1) * 3 + 1];
                coadaArr[i * 3 + 2] = coadaArr[(i - 1) * 3 + 2];
            }
            coadaArr[0] = cometPos.x;
            coadaArr[1] = cometPos.y;
            coadaArr[2] = cometPos.z;
            coadaGeo.attributes.position.needsUpdate = true;
        
            // Camera smooth focus
            if (focusActive && targetPosition) {
                const planeta = targetLookAt;

                // Daca e planeta in miscare, updateaza pozitia tinta
                const idx = parseInt(document.querySelector('.btn-planeta.activ')?.dataset.index);
                if (idx >= 0 && pivoturi[idx]) {
                    const pos = new THREE.Vector3();
                    pivoturi[idx].mesh.getWorldPosition(pos);
                    const raza = idx === 3 ? 0.27 : planete[idx < 3 ? idx : idx - 1].raza;
                    targetPosition = new THREE.Vector3(pos.x + raza * 6, pos.y + raza * 3, pos.z + raza * 6);
                    targetLookAt = pos.clone();
                }

                camera.position.lerp(targetPosition, 0.05); // smooth move
                controls.target.lerp(targetLookAt, 0.05);   // smooth lookat
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>

</html>
